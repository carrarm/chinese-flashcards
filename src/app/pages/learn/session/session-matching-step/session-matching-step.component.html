<div class="column">
  @for (matchCard of leftColumnCards; track matchCard) {
    <chf-card
      class="left-card"
      [class.selected]="matchCard === selectedLeftCard"
      [class.matched]="matchCard.matched"
      (click)="selectLeftCard(matchCard)"
    >
      <div card-content [innerHTML]="matchCard.card.card.meanings | cardMeanings"></div>
    </chf-card>
  }
</div>
<div class="column">
  @for (matchCard of rightColumnCards; track matchCard) {
    <chf-card
      class="right-card"
      [class.selected]="matchCard === selectedRightCard"
      [class.matched]="matchCard.matched"
      (click)="selectRightCard(matchCard)"
    >
      <div card-content class="chf-pinyin-font chinese-translation">
        <span>{{ matchCard.card.characters }}</span>
        <span>{{ matchCard.card.pinyin }}</span>
      </div>
    </chf-card>
  }
</div>
