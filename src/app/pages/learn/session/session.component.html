@if (isSessionDone) {
  @for (sessionCard of sessionResults; track sessionCard.card.id) {
    <div class="card-result-row">
      <div>
        {{ sessionCard.characters ?? sessionCard.pinyin }}
      </div>
      <div class="progress" [class]="sessionCard.sessionProgress">
        <fa-icon [icon]="sessionCard.sessionResultIcon" size="lg" />
      </div>
    </div>
  }
} @else {
  @if (isMatchingStep()) {
    <chf-session-matching-step (completed)="matchingCompleted()" />
  } @else {
    <chf-session-filling-step (completed)="sessionCompleted($event)" />
  }
}
